name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela el que ya está corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # INSUMO/ está en .gitignore, así que en CI el arnés no encuentra el ZIP y
      # sale con 0 avisando. Sirve igual como humo: valida que src/lib/ importe bien.
      - run: npm run verify

      - name: Build
        run: npm run build
        env:
          # El base path tiene que calzar con el nombre del repositorio.
          VITE_BASE: /${{ github.event.repository.name }}/

      # El banner no necesita INSUMO/, así que esto SÍ verifica de verdad en CI, al
      # revés que verify:browser. EXIGIR_CHROME convierte "no hay Chrome" en un fallo
      # ruidoso en vez de un exit 0 que no comprueba nada.
      - name: Verificar el banner
        run: npm run verify:banner
        env:
          EXIGIR_CHROME: '1'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
